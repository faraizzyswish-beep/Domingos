<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva para o  meu Aniversário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            /* Garanta que o arquivo de imagem esteja na mesma pasta com este exato nome */
            background: #111 url('Screenshot_20260925_205052_Google.jpg') no-repeat center center/cover;
            position: relative;
            overflow-x: hidden;
        }

        /* Camada escura de contraste */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(2px);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #ffffff;
            padding: 30px 20px;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            max-width: 90%;
            width: 480px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #f3e5ab;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
        }

        .countdown {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .Convite {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #ffffff;
            padding: 25px 20px;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
            max-width: 90%;
            width: 480px;
        }

        .Convite h1 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #f3e5ab;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
        }

        .box {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #d4af37;
            padding: 15px 8px;
            border-radius: 12px;
            flex: 1;
            min-width: 0;
        }

        .number {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            display: block;
        }

        .label {
            font-size: 0.75rem;
            color: #d4af37;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* Estilos da Localização e Mensagens Adicionadas */
        .location-box {
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .btn-location {
            display: inline-block;
            padding: 10px 20px;
            background: #d4af37;
            color: #111;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .btn-location:hover {
            background: #f3e5ab;
        }

        .waiting-text {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .obs-text {
            color: #d4af37;
            font-size: 0.75rem;
            margin-top: 8px;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.3rem; }
            .Convite h1 { font-size: 1.1rem; }
            .number { font-size: 1.5rem; }
            .label { font-size: 0.65rem; }
            .waiting-text { font-size: 0.95rem; }
            .obs-text { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        <h1>Faltam para o meu aniversário</h1>
        <div class="countdown">
            <div class="box">
                <span class="number" id="days">00</span>
                <span class="label">Dias</span>
            </div>
            <div class="box">
                <span class="number" id="hours">00</span>
                <span class="label">Horas</span>
            </div>
            <div class="box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutos</span>
            </div>
            <div class="box">
                <span class="number" id="seconds">00</span>
                <span class="label">Segundos</span>
            </div>
        </div>
    </div>

    <div class="Convite">
        <h1>VOCÊ É O MEU CONVIDADO ESPECIAL</h1>
        
        <!-- BOTAO DE LOCALIZACAO -->
        <div class="location-box">
            <!-- Substitua o '#' pelo link do seu Google Maps -->
            <a href="https://maps.app.goo.gl/Yj6aCYR5VG1tNuRD7" target="_blank" class="btn-location">📍 Ver Localização</a>
        </div>

        <!-- MENSAGENS -->
        <div class="waiting-text">ESTAREI ESPERANDO POR VOCÊ!</div>
        <div class="obs-text">OBS: ISSO NÃO É UMA FESTA, MAS VAMOS FAZER PARECER UMA.</div>
    </div>

    <script>
        // -------------------------------------------------------------
        // DEFINA AQUI A DATA E HORA EXATAS DO SEU ANIVERSÁRIO!
        // Formato: Ano, Mês (0-11, onde 0 = Jan, 9 = Out, 11 = Dez), Dia, Hora, Min, Seg
        // Exemplo: 18 de Outubro de 2026 às 00:00:00 -> new Date(2026, 9, 18, 0, 0, 0)
        // -------------------------------------------------------------
        const targetDate = new Date(2026, 9, 19, 0, 0, 0).getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.querySelector('.container').innerHTML = '<h1>🎉 O GRANDE DIA CHEGOU! PARABÉNS! 🎂</h1>';
                clearInterval(interval);
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        const interval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
